apiVersion: v1
kind: Pod
metadata:
  name: complex-crashing-pod
  namespace: default
  labels:
    app.kubernetes.io/name: crashing-demo
    tier: backend
  annotations:
    description: "Complex pod designed to demonstrate crash loops and probe failures"
spec:
  # Force restart behavior when container exits with non-zero status
  restartPolicy: Always

  # Init Containers run sequentially before main containers
  initContainers:
    - name: init-prerequisite-check
      image: busybox:1.36
      command: ['sh', '-c']
      args:
        - |
          echo "[INIT] Checking network pre-requisites..."
          # Intentionally failing network check to a non-existent domain/IP
          nc -z -w 2 192.0.2.1 8080 || {
            echo "[INIT ERROR] Required dependency service is unreachable!";
            exit 1; # Exits here, causing Init:CrashLoopBackOff
          }

  containers:
    - name: main-app-container
      image: ubuntu:22.04
      env:
        - name: MAX_MEMORY_MB
          value: "100"
        - name: FAIL_REASON
          value: "Segmentation fault / Missing configuration file"
      
      # Resource constraints configured to trigger OOMKilled if memory spikes
      resources:
        requests:
          memory: "64Mi"
          cpu: "250m"
        limits:
          memory: "128Mi" # Low memory limit
          cpu: "500m"

      # Complex entrypoint script that fails intentionally
      command: ["/bin/bash", "-c"]
      args:
        - |
          set -euo pipefail
          echo "=== Starting Application Framework ==="
          echo "Loading environment variables..."
          
          # Simulate processing stages
          for i in {1..3}; do
            echo "Initializing stage $i..."
            sleep 1
          done

          echo "Attempting to access non-existent configuration file..."
          if [ ! -f /etc/config/app-secret.conf ]; then
            echo "[FATAL ERROR] Required config file '/etc/config/app-secret.conf' missing!" >&2
            echo "Terminating process with exit code 139..." >&2
            exit 139 # Simulates process crash/signal termination
          fi

      # Lifecycle hooks
      lifecycle:
        postStart:
          exec:
            command: ["/bin/sh", "-c", "echo 'Container started' > /var/log/app.log"]
        preStop:
          exec:
            command: ["/bin/sh", "-c", "echo 'Shutting down...' >> /var/log/app.log"]

      # Liveness Probe targeting a non-existent port
      livenessProbe:
        httpGet:
          path: /healthz
          port: 9999 # Nothing is listening on this port!
        initialDelaySeconds: 5
        periodSeconds: 5
        failureThreshold: 2

      # Readiness Probe checking a missing socket file
      readinessProbe:
        exec:
          command:
            - cat
            - /tmp/healthy
        initialDelaySeconds: 3
        periodSeconds: 5

      volumeMounts:
        - name: log-volume
          mountPath: /var/log
        - name: config-volume
          mountPath: /etc/config
          readOnly: true

  volumes:
    - name: log-volume
      emptyDir: {}
    - name: config-volume
      configMap:
        name: non-existent-configmap # Will fail to mount if ConfigMap doesn't exist